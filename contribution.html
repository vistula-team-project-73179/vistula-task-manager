<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2933; margin: 0; }
    main { max-width: 600px; margin: 0 auto; padding: 40px 16px; text-align: center; }
    button { border: none; border-radius: 6px; padding: 10px 18px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    #contributor-student-id { display: block; min-height: 24px; margin: 20px 0; font-weight: 600; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>Team Contribution</h1>
    <button id="load-contributor" type="button">Show Contributor</button>
    <span id="contributor-student-id"></span>
    <a href="index.html">Back to Task Manager</a>
  </main>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      const output = document.getElementById('contributor-student-id');
      try {
        const res = await fetch('contribution.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        output.textContent = `Contributor Student ID: ${data.contributorStudentId}`;
      } catch (err) {
        output.textContent = `Could not load contributor: ${err.message}`;
      }
    });
  </script>
</body>
</html>
